name: Run Tests
on:
  push:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend dependencies
        run: |
          pip install pytest httpx -r ingestion-service/requirements.txt
          pip install pytest httpx -r rules-service/requirements.txt
          pip install pytest httpx -r agent-service/requirements.txt
      - name: Run backend tests
        run: pytest
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install frontend dependencies
        run: npm ci
        working-directory: ./frontend
      - name: Run frontend tests
        run: npm test
        working-directory: ./frontend
