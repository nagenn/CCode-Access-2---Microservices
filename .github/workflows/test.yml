name: Run Tests
on:
  push:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend dependencies
        run: |
          pip install pytest httpx -r contractiq-services/ingestion-service/requirements.txt
          pip install pytest httpx -r contractiq-services/rules-service/requirements.txt
          pip install pytest httpx -r contractiq-services/agent-service/requirements.txt
      - name: Run backend tests
        run: pytest
        working-directory: ./contractiq-services
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install frontend dependencies
        run: npm ci
        working-directory: ./contractiq-services/frontend
      - name: Run frontend tests
        run: npm test
        working-directory: ./contractiq-services/frontend
