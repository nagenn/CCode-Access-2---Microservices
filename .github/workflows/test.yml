name: Run Tests
on:
  push:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend dependencies
        run: |
          pip install pytest httpx -r contractiq-services/ingestion-service/requirements.txt
          pip install pytest httpx -r contractiq-services/rules-service/requirements.txt
          pip install pytest httpx -r contractiq-services/agent-service/requirements.txt
      - name: Run backend tests
        run: pytest
        working-directory: ./contractiq-services
