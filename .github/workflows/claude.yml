name: Claude PR Review
on:
  pull_request:
    types: [opened, synchronize]
permissions:
  contents: read
  pull-requests: write
  id-token: write
jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Use the requirements-validator agent to review this PR's 
            changes against context-map.md. Run it synchronously and 
            wait for it to fully complete — do NOT run it in the 
            background, since this job ends as soon as your turn ends. 
            Check whether any file, table, or endpoint touched here 
            overlaps with what's described there. Post the validator's 
            full report — REQUIREMENT / VERDICT / FINDINGS / WHAT WOULD 
            SLIP THROUGH — as a comment on this pull request, before 
            finishing.
          claude_args: |
            --permission-mode dontAsk --allowedTools "Read" "Grep" "Glob" "Agent" "Bash(gh pr view:*)" "Bash(gh pr diff:*)" "Bash(gh pr comment:*)" "Bash(gh pr list:*)" "Bash(find:*)" "Bash(git status:*)" "Bash(git log:*)" "Bash(git branch:*)" "Bash(git remote:*)" "Bash(git fetch:*)"
